[package]
name = "pkpy"
version = "0.7.0"
edition = "2021"
description = "Python bindings for pkcore, a high-performance poker analysis library"
license = "GPL-3.0-or-later"

[lib]
name = "pkpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
pkcore = { version = "0.7.0", features = ["store"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
