[package]
name = "pkpy"
version = "0.1.0"
edition = "2021"
description = "Python bindings for pkcore, a high-performance poker analysis library"
license = "GPL-3.0-or-later"

[lib]
name = "pkpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
pkcore = "0.0.29"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
