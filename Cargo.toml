[package]
name = "pkcore-py"
version = "0.9.0"
edition = "2021"
description = "Python bindings for pkcore, a high-performance poker analysis library"
license = "MIT OR Apache-2.0"

[lib]
name = "_pkcore"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
pkcore = { version = "0.9.0", features = ["store"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
